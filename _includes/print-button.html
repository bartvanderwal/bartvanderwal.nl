<button onclick="window.print()" class="print-button" title="Print or save as PDF">
  Print / PDF
</button>

<style>
.print-button {
  position: fixed;
  top: 10px;
  right: 10px;
  padding: 8px 16px;
  background: #333;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
  z-index: 1000;
}
.print-button:hover {
  background: #555;
}
@media print {
  .print-button {
    display: none;
  }
}
</style>
