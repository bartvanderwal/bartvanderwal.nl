<style>
.print-button {
  position: fixed;
  top: 10px;
  right: 10px;
  padding: 8px 16px;
  background: #333;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
  z-index: 1000;
}
.print-button:hover {
  background: #555;
}
@media print {
  .print-button, .site-header, .site-footer {
    display: none !important;
  }
  .post-content {
    margin: 0;
    padding: 0;
  }
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var btn = document.createElement('button');
  btn.className = 'print-button';
  btn.textContent = 'Print / PDF';
  btn.title = 'Print or save as PDF';
  btn.onclick = function() { window.print(); };
  document.body.appendChild(btn);
});
</script>
