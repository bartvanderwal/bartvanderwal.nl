<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}

  <!-- Print/PDF Button -->
  <style>
  .print-button {
    position: fixed;
    top: 10px;
    right: 10px;
    padding: 8px 16px;
    background: #424242;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    z-index: 1000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .print-button:hover {
    background: #616161;
  }
  @media print {
    .print-button, .site-header, .site-footer {
      display: none !important;
    }
  }
  </style>
</head>
